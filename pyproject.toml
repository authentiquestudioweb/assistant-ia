[project]
name = "lea"
version = "0.1.0"
description = "Léa — réceptionniste vocale IA pour cabinet dentaire, 100 % locale et open source"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Agenda Google (OAuth) — facultatif : `uv sync --extra google`
google = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

# Voix (étape 2) — `uv sync --extra voice`
# pipecat-ai est épinglé à 0.0.108 : c'est la dernière version compatible
# avec onnxruntime 1.23.2, la dernière qui existe pour Mac Intel (x86_64).
voice = [
    "pipecat-ai[webrtc,silero,whisper,piper,groq]==0.0.108",
    "onnxruntime~=1.23.2",
    # idem : dernières versions publiées pour Mac Intel (sinon compilation impossible)
    "numba~=0.62.1",
    "llvmlite~=0.45.1",
    "cryptography~=48.0.1",
    "websockets>=13.1",  # requis par pipecat 0.0.108 mais non déclaré
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# Voix de secours si Piper pose problème — `uv sync --extra voice --extra kokoro`
kokoro = [
    "pipecat-ai[kokoro]==0.0.108",
]

[project.scripts]
lea = "lea.cli:main"
lea-google-auth = "lea.calendars.google:auth_main"
lea-voice = "lea.voice.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Mac Intel (2019) : n'accepter que des versions publiées en binaire pour x86_64,
# sinon uv tente de compiler (llvmlite, cryptography…) et échoue.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
